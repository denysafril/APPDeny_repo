# ====================================================================
# KONFIGURASI APACHE VIRTUAL HOST UNTUK XAMPP (PORT 80 -> PORT 3000)
# ====================================================================
#
# File ini digunakan jika Anda ingin Dewan Juri mengakses aplikasi lewat Port 80 standar
# (cukup buka: http://192.168.x.x tanpa mengetik :3000 di browser).
#
# CARA PEMASANGAN DI XAMPP WINDOWS:
# --------------------------------------------------------------------
# 1. Buka file: C:\xampp\apache\conf\httpd.conf
#    Pastikan baris berikut TIDAK memiliki tanda pagar '#' di depannya (sudah aktif):
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
#      LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#
#    Pastikan juga baris include virtual hosts aktif di httpd.conf:
#      Include conf/extra/httpd-vhosts.conf
#
# 2. Buka file: C:\xampp\apache\conf\extra\httpd-vhosts.conf
#    Lalu paste konfigurasi di bawah ini pada bagian paling bawah file:

<VirtualHost *:80>
    ServerAdmin panitia@festivalband.local
    ServerName localhost
    # ServerAlias 192.168.1.15  (opsional: masukkan IP laptop Anda)

    ProxyRequests Off
    ProxyPreserveHost On

    # Meneruskan seluruh request port 80 ke server Node.js di Port 3000
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Meneruskan stream Server-Sent Events (SSE) untuk update nilai real-time
    <Location /api/events>
        ProxyPass http://127.0.0.1:3000/api/events retry=0 timeout=3600
        ProxyPassReverse http://127.0.0.1:3000/api/events
        SetEnv proxy-nokeepalive 1
    </Location>

    ErrorLog "logs/festival-band-error.log"
    CustomLog "logs/festival-band-access.log" common
</VirtualHost>
